version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    labels: [ "dependencies" ]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Abstractions stay at their lowest supported version (ADR-0004). Their own group gives a raise a PR of its own,
      # which the maintainer must answer explicitly, without holding back the implementation updates below.
      abstractions:
        patterns: [ "*.Abstractions" ]
      microsoft-extensions:
        patterns: [ "Microsoft.Extensions.*", "System.*" ]
        exclude-patterns: [ "*.Abstractions" ]
      test-dependencies:
        patterns: [ "xunit*", "Microsoft.NET.Test.Sdk", "Microsoft.Testing.*", "NSubstitute*", "Shouldly", "Bogus", "WireMock.Net*" ]
      build-tooling:
        patterns: [ "Nerdbank.GitVersioning" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Warsaw"
    labels: [ "dependencies", "ci" ]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: [ "*" ]
