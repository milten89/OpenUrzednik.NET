version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    labels: [ "dependencies" ]
    commit-message:
      prefix: "chore(deps)"
    # Abstractions stay at their lowest supported version (ADR-0004): x.0.0 of the oldest .NET target's major. A version
    # update would break that rule except for a vulnerability fix (#41, #56), so none are opened. A vulnerability still shows as a Dependabot
    # alert; then raise the version by hand to the first fixed patch.
    ignore:
      - dependency-name: "*.Abstractions"
        update-types: [ "version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch" ]
      # Dependencies of the published libraries: patch updates only (ADR-0004). Each version is a minimum for every app, so
      # a minor or major raise is a deliberate change made by hand. Test and tooling packages keep getting every update.
      # The net8.0 overrides in Directory.Packages.props (PackageVersion Update) are patched by hand.
      - dependency-name: "Microsoft.Extensions.Http"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "Microsoft.Extensions.Options"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "System.Text.Json"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "System.Net.Http.Json"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "System.Diagnostics.DiagnosticSource"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "Microsoft.Bcl.TimeProvider"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "Microsoft.Bcl.HashCode"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "Polly.Core"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
    groups:
      # Every dependency of the published libraries in one PR.
      published-dependencies:
        patterns: [ "Microsoft.Extensions.Http", "Microsoft.Extensions.Options", "System.*", "Microsoft.Bcl.*", "Polly.Core" ]
      test-dependencies:
        patterns: [ "xunit*", "Microsoft.NET.Test.Sdk", "Microsoft.Testing.*", "NSubstitute*", "Shouldly", "Bogus", "WireMock.Net*",
                    "Microsoft.Extensions.TimeProvider.Testing", "Microsoft.Extensions.Http.Resilience" ]
      build-tooling:
        patterns: [ "Nerdbank.GitVersioning" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Warsaw"
    labels: [ "dependencies", "ci" ]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: [ "*" ]
