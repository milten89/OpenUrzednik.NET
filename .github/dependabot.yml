version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    labels: [ "dependencies" ]
    commit-message:
      prefix: "chore(deps)"
    # Abstractions stay at their lowest supported version (ADR-0004): x.0.0 of the oldest .NET target's major. A version
    # update would break that rule except for a vulnerability fix (#41, #56), so none are opened. A vulnerability still shows as a Dependabot
    # alert; then raise the version by hand to the first fixed patch.
    ignore:
      - dependency-name: "*.Abstractions"
        update-types: [ "version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch" ]
    groups:
      microsoft-extensions:
        patterns: [ "Microsoft.Extensions.*", "System.*" ]
        exclude-patterns: [ "*.Abstractions" ]
      test-dependencies:
        patterns: [ "xunit*", "Microsoft.NET.Test.Sdk", "Microsoft.Testing.*", "NSubstitute*", "Shouldly", "Bogus", "WireMock.Net*" ]
      build-tooling:
        patterns: [ "Nerdbank.GitVersioning" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Warsaw"
    labels: [ "dependencies", "ci" ]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: [ "*" ]
