# Categories for automatically generated release notes (gh release create --generate-notes).
changelog:
  exclude:
    labels: [ "skip-changelog" ]
  categories:
    - title: 💥 Breaking changes
      labels: [ "breaking-change" ]
    - title: 🚀 Features
      labels: [ "enhancement" ]
    - title: 🐞 Bug fixes
      labels: [ "bug" ]
    - title: 📚 Documentation
      labels: [ "documentation" ]
    - title: 📦 Dependencies
      labels: [ "dependencies" ]
    - title: 🛠️ CI and tooling
      labels: [ "ci" ]
    - title: Other changes
      labels: [ "*" ]
