name: 🏛️ Nowe źródło danych / New provider proposal
description: Zaproponuj integrację z kolejnym publicznym API. / Propose integration with another public API.
labels: [ "provider-proposal" ]
body:
  - type: markdown
    attributes:
      value: |
        Nowe providery są realizowane dopiero po ukończeniu pakietu NBP ([ADR-0010](https://github.com/milten89/OpenUrzednik.NET/blob/develop/docs/adr/0010-provider-readiness-gate.md)). Propozycje zbieramy już teraz.
        New providers start only after the NBP package is finished (ADR-0010). Proposals are welcome now.
  - type: input
    id: name
    attributes:
      label: Nazwa API / API name
      placeholder: "np. CEIDG, VIES, KSeF"
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Dokumentacja / Documentation URL
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protokół / Protocol
      options: [ "REST/JSON", "SOAP/XML", "Inny / Other" ]
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Uwierzytelnianie / Authentication
      options: [ "Brak / None", "Klucz API / API key", "Certyfikat / Certificate", "OAuth / token", "Inne / Other" ]
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Limity i regulamin / Rate limits and terms of use
  - type: textarea
    id: use-case
    attributes:
      label: Zastosowanie / Use case
      description: Do czego potrzebujesz tego API? / What do you need it for?
    validations:
      required: true
