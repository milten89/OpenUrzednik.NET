name: Dependency Review

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # NOTE: "dependency-review" is a required status check in the "protected-branches" ruleset (see docs/GITHUB-SETUP.md).
    # Fails a PR that adds or updates a package with a known vulnerability of moderate severity or higher.
    name: dependency-review
    runs-on: ubuntu-latest
    # No checkout: the action compares base and head through the dependency graph API.
    steps:
    - name: Review dependency changes
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: moderate
        comment-summary-in-pr: never
