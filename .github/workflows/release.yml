name: official-release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write   # needed to push tags and create GitHub Releases

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # NBGV needs full history to compute versions

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-pack-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-pack-

      - name: Restore & Build & Pack
        run: |
          dotnet restore OpenUrzednik.slnx
          dotnet build OpenUrzednik.slnx --configuration Release --no-restore
          dotnet pack OpenUrzednik.slnx --configuration Release --no-build --output ./artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push release packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Tag and create GitHub Release per package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install --global nbgv
          export PATH="$PATH:$HOME/.dotnet/tools"

          for proj in src/*/; do
            name=$(basename "$proj")
            version=$(nbgv get-version --project "$proj" --format json | jq -r .NuGetPackageVersion)
            package_file="./artifacts/${name}.${version}.nupkg"

            # skip if this package wasn't built in this run (no changes)
            if [ ! -f "$package_file" ]; then
              echo "No changes in $name — skipping tag and release."
              continue
            fi

            tag="${name}/v${version}"

            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists — skipping."
              continue
            fi

            git tag "$tag"
            git push origin "$tag"
            gh release create "$tag" "$package_file" \
              --title "${name} ${version}" --generate-notes
          done