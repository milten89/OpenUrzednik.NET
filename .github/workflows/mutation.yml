name: Mutation tests

# Stryker.NET mutation testing (ADR-0020): every shard before every release (PRs into main and support branches), every Monday on
# develop and on demand; on a PR into develop, only the shards its changes affect (run.py --changed-since). Shards are listed in
# tests/Mutation/shards.json and run by tests/Mutation/run.py, which fails a shard on an untested run, an undetected mutant in a
# strict file, or a score below the shard's break value.

on:
  pull_request:
    branches: [ develop, main, 'release/*.x' ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nerdbank.GitVersioning exports its version variables to $GITHUB_ENV in every project build. Nothing reads them, and
  # builds writing the file at once probably left a broken line in it (#241). The versions are still computed as MSBuild properties.
  NBGV_SetCloudBuildVersionVars: 'false'

jobs:
  shard:
    name: shard (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One runner per project under test (core also runs the small transport-http shard); Stryker runs single-threaded (concurrency 1, stryker-net #3832), so parallel
      # runners are the speed-up. Shared source (src/Identifiers, src/Privacy, src/Dates, src/Http) is mutated in its test-only host's
      # shard, by its own tests, and its netstandard2.0 branches in the -netstandard shard on the same runner (ADR-0020); a
      # provider's shards mutate only the provider's code (!**/Http/**).
      matrix:
        include:
          - name: identifiers
            shards: identifiers identifiers-netstandard dates
          - name: nbp
            shards: nbp
          - name: mf-white-list
            shards: mf-white-list
          - name: http
            shards: http http-netstandard
          - name: http-di
            shards: http-di
          - name: core
            shards: core transport-http
          - name: adapters
            shards: di logging diagnostics

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history: NBGV computes versions during Stryker's build, and the selection below diffs against the PR's base.
        fetch-depth: 0

    # On a PR into develop, only the job's shards that the PR's changes affect run; the steps below skip when none does, and the
    # job passes. Every other run takes all of them. A failed selection (exit 2) fails the job, never skips it.
    - name: Select the shards
      id: select
      env:
        SHARDS: ${{ matrix.shards }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_BASE_REF" = develop ]; then
          selected=$(python3 tests/Mutation/run.py --changed-since "$BASE_SHA" --list $SHARDS)
        else
          selected=$SHARDS
        fi
        selected=$(echo $selected)
        echo "shards=$selected" >> "$GITHUB_OUTPUT"
        echo "Shards to run: ${selected:-none}"

    # Stryker 5 needs the .NET 10 runtime; the projects multi-target, so restore needs the newest SDK.
    - name: Setup .NET SDKs
      if: ${{ steps.select.outputs.shards != '' }}
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Cache NuGet packages
      if: ${{ steps.select.outputs.shards != '' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore the tools
      if: ${{ steps.select.outputs.shards != '' }}
      run: dotnet tool restore

    # Stryker's design-time build of each project needs restored packages. Without them it drops test projects silently
    # (fewer tests, mutants without coverage) or compiles a project without its package references.
    - name: Restore dependencies
      if: ${{ steps.select.outputs.shards != '' }}
      run: dotnet restore OpenUrzednik.slnx

    - name: Run the mutation shards
      if: ${{ steps.select.outputs.shards != '' }}
      env:
        SHARDS: ${{ steps.select.outputs.shards }}
      run: python3 tests/Mutation/run.py $SHARDS

    - name: Add the summary
      if: ${{ !cancelled() }}
      env:
        SHARDS: ${{ matrix.shards }}
        SELECTED: ${{ steps.select.outputs.shards }}
        SELECTION: ${{ steps.select.outcome }}
      run: |
        if [ -f artifacts/mutation/summary.md ]; then
          cat artifacts/mutation/summary.md >> "$GITHUB_STEP_SUMMARY"
        elif [ "$SELECTION" = success ] && [ -z "$SELECTED" ]; then
          echo "No shard of this job is affected by the PR's changes ($SHARDS)." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload the reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mutation-${{ matrix.name }}
        # Each shard's tmp folder is Stryker's private temp (NuGet scratch, logs): not part of the report.
        path: |
          artifacts/mutation
          !artifacts/mutation/*/tmp
        if-no-files-found: ignore
        retention-days: 30

  mutation:
    # NOTE: "mutation" is the required status check of the "develop-mutation" ruleset (develop), and of the "release-mutation"
    # ruleset (main, release/*.x) once that one is created after 1.1.0 ships (docs/GITHUB-SETUP.md). If you rename this job,
    # update both rulesets.
    name: mutation
    needs: shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Check every shard
      env:
        RESULT: ${{ needs.shard.result }}
      run: |
        if [ "$RESULT" != "success" ]; then
          echo "::error::At least one mutation shard didn't pass ($RESULT). See the shard jobs' summaries and reports."
          exit 1
        fi
