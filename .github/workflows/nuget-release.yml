name: NuGet - release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Releases are queued, never cancelled: a half-finished publish/tag run must not be interrupted.
concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      id-token: write
      contents: write   # needed to push tags and create GitHub Releases

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # NBGV needs full history to compute versions

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-pack-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-pack-

      - name: Restore & Build & Pack
        run: |
          # Only the packages (src/): the test projects also target net472, which this Linux job doesn't need to build.
          dotnet restore OpenUrzednik.Packages.slnf
          dotnet build OpenUrzednik.Packages.slnf --configuration Release --no-restore
          dotnet pack OpenUrzednik.Packages.slnf --configuration Release --no-build --output ./artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push release packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Tag and create GitHub Release per package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install --global nbgv
          export PATH="$PATH:$HOME/.dotnet/tools"

          for proj in src/*/; do
            name=$(basename "$proj")
            version=$(nbgv get-version --project "$proj" --format json | jq -r .NuGetPackageVersion)
            package_file="./artifacts/${name}.${version}.nupkg"

            # skip if this package wasn't built in this run (no changes)
            if [ ! -f "$package_file" ]; then
              echo "No changes in $name — skipping tag and release."
              continue
            fi

            tag="${name}/v${version}"

            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists — skipping."
              continue
            fi

            git tag "$tag"
            git push origin "$tag"
            gh release create "$tag" "$package_file" \
              --title "${name} ${version}" --generate-notes
          done